; OpenAnimationReplacer - RaySense
; Configuration file
; 설정 파일

[Debug]
; Enable verbose logging to the SKSE log file.
; SKSE 로그 파일에 상세 센서 데이터를 기록합니다.
; Default / 기본값: 0
bEnableLog=0

; Enable in-world sensor dot visualization via ImGui (Default: 0)
; 인게임 센서 시각화 점 표시 활성화 (기본값: 0)
bEnableDebugDraw=0

[Tweaks]
; How long (in seconds) to keep sensors frozen after leaving furniture.
; Prevents false reads during exit animation blend.
; 가구(의자/침대)에서 일어난 직후 센서 오작동 방지를 위한 일시 정지 시간(초).
; Default / 기본값: 1.0
fFurnitureExitCooldown=1.0

; Obstacle detection distance while walking (in Skyrim units).
; 걷기 상태에서 장애물을 감지하는 레이캐스트 거리 (스카이림 단위).
; Default / 기본값: 230
fObstacleWalkDistance=230

; Obstacle detection distance while sprinting (in Skyrim units).
; 질주(Sprint) 상태에서 장애물을 감지하는 레이캐스트 거리 (스카이림 단위).
; Default / 기본값: 330
fObstacleSprintDistance=330

; Enable the jump bonus when an obstacle is detected.
; 장애물이 감지되었을 때 점프 높이 보너스를 적용할지 여부.
; Default / 기본값: 1
bEnableJumpBonus=1

; Extra jump height added on jump when an obstacle is detected (in Skyrim units).
; 장애물 앞에서 점프할 때 추가되는 점프 높이 값 (스카이림 단위).
; Default / 기본값: 30
fJumpBonus=30
